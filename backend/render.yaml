services:
  - type: web
    name: rescue-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rescueme_pets_db
          property: connectionString

